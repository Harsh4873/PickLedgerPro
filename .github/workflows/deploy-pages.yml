name: Deploy to GitHub Pages

# This repository publishes the landing launcher and /today/ only. Every app it
# links to (PickLedger, Gym, Portfolio, Daymark, Slate, Fare, MtbScope, Recall,
# Notes, ShotLab, Studies, Degree, Radar) is its own repository with its own
# Pages deployment serving harsh.bet/<app>/, so nothing here rebuilds them.
#
# Nothing in this workflow is gated on daily sports data: a landing or Today fix
# must never be silently skipped because a data refresh elsewhere ran late.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout landing site
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pytest

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build landing artifact
        run: npm run build

      - name: Verify Pages artifact
        run: |
          test -f dist/index.html
          test -f dist/today/index.html
          test -f dist/robots.txt
          test -f dist/CNAME
          test -f dist/.nojekyll
          python scripts/site_upcheck.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
